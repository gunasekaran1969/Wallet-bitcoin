name: Build BitNova Wallet

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build wallet
        run: npm run build

      - name: Verify wallet bundle
        run: |
          test -s wallet.bundle.js
          echo "BitNova wallet bundle created successfully"

      - name: Save wallet bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wallet.bundle.js
          git diff --cached --quiet || git commit -m "Add BitNova wallet browser bundle"
          git push
